<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <style>
      .navy-fill { fill: #0B2545; }
      .orange-fill { fill: #F26522; }
      .text-garamba { font-family: 'Arial Black', 'Trebuchet MS', sans-serif; font-weight: 900; font-size: 58px; fill: #0B2545; letter-spacing: 1px; }
      .text-sub { font-family: 'Arial', 'Helvetica Neue', sans-serif; font-weight: 700; font-size: 25px; fill: #2C3E50; letter-spacing: 4px; }
    </style>
  </defs>

  <g transform="translate(10, 0)">
