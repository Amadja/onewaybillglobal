    <path class="navy-fill" d="M 140 180 C 170 180 197 162 208 135 L 227 142 C 213 178 179 202 140 202 C 122 202 105 196 91 186 L 103 169 C 114 176 126 180 140 180 Z" transform="matrix(0.96 0.28 -0.28 0.96 50 -30)" />

    <!-- Airplane Symbol -->
    <!-- Main Wing/Body -->
    <path class="navy-fill" d="M 65 52 L 235 118 C 220 122 170 135 135 142 L 155 120 L 115 110 L 80 128 L 88 102 L 65 52 Z" />
    <path class="navy-fill" d="M 125 150 L 185 130 L 135 178 Z" />

    <!-- Orange Dynamic Swoosh -->
    <path class="orange-fill" d="M 20 115 C 60 155 130 185 245 122 C 175 162 105 162 50 138 C 38 133 28 125 20 115 Z" />
  </g>

  <!-- Text Section -->
  <!-- GARAMBA -->
